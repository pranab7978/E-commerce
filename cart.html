<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEase | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f101a; --card: #1a1b2e; --primary: #6366f1; --accent: #fbbf24; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 30px; }
        
        .container { max-width: 800px; margin: 0 auto; }
        .cart-item { display: flex; gap: 20px; background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 12px; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        
        .qty-controls { display: flex; align-items: center; gap: 10px; background: #000; padding: 5px 10px; border-radius: 20px; width: fit-content; margin-top: 10px; }
        .qty-btn { background: none; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 5px; }
        .qty-val { color: var(--accent); font-weight: bold; }

        .btn-checkout { width: 100%; background: var(--primary); padding: 15px; border:none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn-checkout:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <a href="products.html" style="color:#aaa; text-decoration:none;">← Back to Shop</a>
    <h1 style="margin: 20px 0;">Your Bag</h1>
    <div id="cartList"></div>
    
    <div style="margin-top: 30px; text-align: right;">
        <h2>Total: <span id="grandTotal" style="color:var(--accent)">₹0</span></h2>
        <button class="btn-checkout" onclick="proceedToAddress()">Proceed to Checkout</button>
    </div>
</div>

<script>
    function renderCart() {
        const list = document.getElementById('cartList');
        const cart = JSON.parse(localStorage.getItem('shopease_cart')) || [];
        list.innerHTML = '';
        let total = 0;

        if(cart.length === 0) {
            list.innerHTML = '<p>Cart is empty.</p>';
            document.getElementById('grandTotal').innerText = '₹0';
            return;
        }

        cart.forEach((item, index) => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;

            list.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" onerror="this.src='https://via.placeholder.com/80?text=Item'">
                    <div style="flex:1;">
                        <h3>${item.title}</h3>
                        <p style="color:#aaa; font-size:12px;">Size: ${item.selectedSize || 'N/A'}</p>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                            <span class="qty-val">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold;">₹${itemTotal.toLocaleString()}</div>
                    </div>
                </div>
            `;
        });
        
        document.getElementById('grandTotal').innerText = '₹' + total.toLocaleString();
        // Save total for next pages
        localStorage.setItem('shopease_total', total);
    }

    function updateQty(index, change) {
        let cart = JSON.parse(localStorage.getItem('shopease_cart'));
        
        cart[index].quantity += change;

        if(cart[index].quantity <= 0) {
            if(confirm("Remove this item from cart?")) {
                cart.splice(index, 1);
            } else {
                cart[index].quantity = 1; 
            }
        }

        localStorage.setItem('shopease_cart', JSON.stringify(cart));
        renderCart();
    }

    function proceedToAddress() {
        const cart = JSON.parse(localStorage.getItem('shopease_cart')) || [];
        if(cart.length === 0) {
            alert("Cart is empty");
            return;
        }
        // Redirect to Address Page
        window.location.href = "checkout.html";
    }

    window.onload = renderCart;
</script>

</body>
</html>
