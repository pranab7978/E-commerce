<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | The Vault</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #020202;
            --gold: #d4af37;
            --gold-dim: #8a701e;
            --glass: rgba(20, 20, 20, 0.6);
            --border: rgba(212, 175, 55, 0.2);
            --text: #e5e5e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(100, 100, 255, 0.03) 0%, transparent 25%);
        }

        /* --- SECURITY LOCK SCREEN --- */
        .security-overlay {
            position: fixed; inset: 0;
            background: #000;
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        .scanner-ring {
            width: 150px; height: 150px;
            border: 2px solid #333;
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .status-text {
            font-family: 'Courier New', monospace;
            color: var(--gold);
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .access-denied { color: #ff3333; border-top-color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.2); }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- VAULT LAYOUT --- */
        .vault-container {
            opacity: 0; transform: scale(0.98);
            transition: 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 1400px; margin: 0 auto; padding: 40px;
        }
        
        .vault-visible { opacity: 1; transform: scale(1); }

        .header {
            text-align: center; margin-bottom: 80px; position: relative;
        }
        
        .header::after {
            content: ''; display: block; width: 60px; height: 2px; 
            background: var(--gold); margin: 30px auto;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 5px; margin-bottom: 10px;
        }

        .header p {
            color: #888; letter-spacing: 3px; font-size: 0.9rem; text-transform: uppercase;
        }

        .back-link {
            position: absolute; top: 0; left: 0;
            color: #666; text-decoration: none; font-size: 12px;
            border: 1px solid #333; padding: 10px 20px;
            border-radius: 30px; transition: 0.3s;
        }
        .back-link:hover { border-color: var(--gold); color: var(--gold); }

        /* --- GRID --- */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        /* --- LUXURY CARD --- */
        .vault-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .vault-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .img-wrapper {
            height: 400px; width: 100%;
            overflow: hidden; position: relative;
        }

        .img-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s ease;
            filter: grayscale(80%) contrast(1.1);
        }

        .vault-card:hover img {
            transform: scale(1.1);
            filter: grayscale(0%) contrast(1);
        }

        .card-details {
            padding: 30px;
            text-align: center;
            background: linear-gradient(to top, #000, transparent);
            position: absolute; bottom: 0; width: 100%;
        }

        .edition-tag {
            color: var(--gold); font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 10px; display: block;
            font-weight: 700;
        }

        .vault-card h3 {
            font-family: 'Cinzel', serif; font-size: 1.5rem; margin-bottom: 15px; color: white;
        }

        .price-row {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin-top: 20px; opacity: 0.7; transition: 0.3s;
        }
        
        .vault-card:hover .price-row { opacity: 1; }

        .price { font-size: 1.4rem; color: #fff; font-weight: 300; }

        .btn-reserve {
            background: transparent; color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 25px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            transition: 0.3s;
        }

        .btn-reserve:hover {
            background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold-dim);
        }

        /* --- STOCK INDICATOR --- */
        .scarcity-bar {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px; border: 1px solid #333;
            font-size: 10px; color: #aaa;
            backdrop-filter: blur(5px);
        }
        .scarcity-bar span { color: #ff4444; font-weight: bold; }

    </style>
</head>
<body>

    <div id="securityLayer" class="security-overlay">
        <div id="scanner" class="scanner-ring"></div>
        <div id="statusText" class="status-text">Scanning Biometrics...</div>
        
        <div id="loginPrompt" style="display: none; text-align: center; margin-top: 30px;">
            <p style="color: #666; margin-bottom: 20px;">Identity Verification Failed.</p>
            <a href="login.html" class="btn-reserve">AUTHENTICATE NOW</a>
        </div>
    </div>

    <div id="vaultContent" class="vault-container">
        <div class="header">
            <a href="index.html" class="back-link">EXIT SECURE ZONE</a>
            <h1>THE VAULT</h1>
            <p>Prototype & Limited Run Collections</p>
        </div>

        <div class="vault-grid" id="vaultGrid">
            </div>
    </div>

    <script>
        // --- 1. MOCK DATA FOR EXCLUSIVE ITEMS ---
        const vaultItems = [
            {
                id: 101,
                title: "Obsidian Tourbillon",
                price: 15000,
                edition: "1 of 10 Worldwide",
                stock: 2,
                image: "https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: 102,
                title: "Cyber-Deck 2099",
                price: 4500,
                edition: "Prototype Hardware",
                stock: 5,
                image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: 103,
                title: "Liquid Gold Sneaker",
                price: 2200,
                edition: "Artist Collaboration",
                stock: 8,
                image: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=800&auto=format&fit=crop"
            }
        ];

        // --- 2. SECURITY LOGIC ---
        window.onload = () => {
            const user = localStorage.getItem('shopease_user');
            const securityLayer = document.getElementById('securityLayer');
            const scanner = document.getElementById('scanner');
            const statusText = document.getElementById('statusText');
            const vaultContent = document.getElementById('vaultContent');
            const loginPrompt = document.getElementById('loginPrompt');

            if (user) {
                // SUCCESS SEQUENCE
                setTimeout(() => { statusText.innerText = "Identity Verified."; statusText.style.color = "#4ade80"; scanner.style.borderColor = "#4ade80"; }, 1500);
                setTimeout(() => { statusText.innerText = "Decrypting Vault..."; }, 2200);
                setTimeout(() => {
                    securityLayer.style.opacity = "0";
                    securityLayer.style.visibility = "hidden";
                    vaultContent.classList.add('vault-visible');
                    renderVaultItems();
                }, 3000);
            } else {
                // FAILURE SEQUENCE
                setTimeout(() => {
                    statusText.innerText = "ACCESS DENIED";
                    statusText.style.color = "#ff3333";
                    scanner.style.borderTopColor = "#ff3333";
                    scanner.style.animationDuration = "0.2s"; // Panic spin
                    loginPrompt.style.display = "block";
                }, 2000);
            }
        };

        // --- 3. RENDER ITEMS ---
        function renderVaultItems() {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';

            vaultItems.forEach(item => {
                grid.innerHTML += `
                    <div class="vault-card">
                        <div class="scarcity-bar">Remaining: <span>${item.stock}</span></div>
                        <div class="img-wrapper">
                            <img src="${item.image}" alt="${item.title}">
                        </div>
                        <div class="card-details">
                            <span class="edition-tag">${item.edition}</span>
                            <h3>${item.title}</h3>
                            <div class="price-row">
                                <span class="price">$${item.price.toLocaleString()}</span>
                                <button class="btn-reserve" onclick="reserveItem('${item.title}')">SECURE</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function reserveItem(title) {
            alert(`Concierge Service:\n\nWe have received your interest in the '${title}'.\nA private agent will contact you shortly to arrange secure payment and armored delivery.`);
        }
    </script>

</body>
</html>
