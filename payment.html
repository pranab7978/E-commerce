<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEase | Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f101a; --card: #1a1b2e; --primary: #6366f1; --accent: #fbbf24; --text: #f8fafc; --border: rgba(255, 255, 255, 0.1); --success: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 30px; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 500px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        h2 { margin-bottom: 20px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        h3 { font-size: 16px; margin-bottom: 10px; color: #fff; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #aaa; }
        .total-row { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); font-weight: bold; font-size: 18px; color: white; }
        
        .payment-option { 
            border: 1px solid var(--border); padding: 15px; border-radius: 10px; 
            margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: 0.3s;
        }
        .payment-option:hover, .payment-option.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .radio-circle { width: 16px; height: 16px; border: 2px solid #aaa; border-radius: 50%; }
        .selected .radio-circle { border-color: var(--primary); background: var(--primary); }

        .btn-pay { width: 100%; background: var(--success); padding: 15px; border:none; color: black; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-pay:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <a href="checkout.html" style="color:#aaa; text-decoration:none; margin-bottom: 20px; display:block;">← Back to Address</a>
    
    <div class="card">
        <h2>Order Summary</h2>
        <div id="orderItems"></div>
        <div class="total-row">
            <span>Total to Pay</span>
            <span id="payTotal" style="color:var(--accent)">₹0</span>
        </div>
    </div>

    <div class="card">
        <h2>Payment Method</h2>
        
        <div class="payment-option selected" onclick="selectMethod(this, 'card')">
            <div class="radio-circle"></div>
            <span>Credit / Debit Card</span>
        </div>
        
        <div class="payment-option" onclick="selectMethod(this, 'cod')">
            <div class="radio-circle"></div>
            <span>Cash on Delivery (COD)</span>
        </div>

        <div id="cardDetails" style="margin-top: 20px;">
            <input type="text" placeholder="Card Number" style="width:100%; padding:10px; background:#050505; border:1px solid #333; color:white; border-radius:5px; margin-bottom:10px;">
            <div style="display:flex; gap:10px;">
                <input type="text" placeholder="MM/YY" style="flex:1; padding:10px; background:#050505; border:1px solid #333; color:white; border-radius:5px;">
                <input type="text" placeholder="CVV" style="flex:1; padding:10px; background:#050505; border:1px solid #333; color:white; border-radius:5px;">
            </div>
        </div>

        <button class="btn-pay" id="payBtn" onclick="placeOrder()">Pay & Place Order</button>
    </div>
</div>

<script>
    let paymentMethod = 'card';

    window.onload = () => {
        const cart = JSON.parse(localStorage.getItem('shopease_cart')) || [];
        const total = localStorage.getItem('shopease_total') || 0;
        
        const summaryDiv = document.getElementById('orderItems');
        let html = '';
        
        cart.forEach(item => {
            html += `
                <div class="summary-row">
                    <span>${item.quantity}x ${item.title}</span>
                    <span>₹${(item.price * item.quantity).toLocaleString()}</span>
                </div>
            `;
        });
        
        summaryDiv.innerHTML = html;
        document.getElementById('payTotal').innerText = '₹' + parseInt(total).toLocaleString();
    };

    function selectMethod(el, method) {
        paymentMethod = method;
        
        // Visual toggle
        document.querySelectorAll('.payment-option').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');

        // Hide card inputs if COD
        const cardBox = document.getElementById('cardDetails');
        const btn = document.getElementById('payBtn');
        
        if(method === 'cod') {
            cardBox.style.display = 'none';
            btn.innerText = "Place Order (COD)";
        } else {
            cardBox.style.display = 'block';
            btn.innerText = "Pay & Place Order";
        }
    }

    async function placeOrder() {
        const cart = JSON.parse(localStorage.getItem('shopease_cart')) || [];
        const btn = document.getElementById('payBtn');
        
        if(cart.length === 0) return alert("Cart is empty");

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            // Call Backend to update stock
            const res = await fetch('http://localhost:8080/api/admin/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cart)
            });
            
            if(res.ok) {
                alert("🎉 Order Placed Successfully!\nThank you for shopping with ShopEase.");
                localStorage.removeItem('shopease_cart');
                localStorage.removeItem('shopease_total');
                window.location.href = "index.html";
            } else {
                const err = await res.json();
                alert("❌ Order Failed: " + (err.message || "Unknown error"));
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        } catch(e) { 
            console.error(e);
            alert("Server Error. Check console.");
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
